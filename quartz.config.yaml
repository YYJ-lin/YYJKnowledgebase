# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 云屿集
  pageTitleSuffix: " · 项目记录与技术教程"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: null
  locale: zh-CN
  baseUrl: yyj-lin.github.io/YYJKnowledgebase
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: IBM Plex Sans
      body: IBM Plex Sans
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#fafaf9"
        lightgray: "#f5f5f4"
        gray: "#c4c4cc"
        darkgray: "#3f3f46"
        dark: "#18181b"
        secondary: "#1d4ed8"
        tertiary: "#3b5bdb"
        highlight: rgba(59, 91, 219, 0.10)
        textHighlight: "#fff23688"
      darkMode:
        light: "#0c0a09"
        lightgray: "#1c1917"
        gray: "#3f3f46"
        darkgray: "#d4d4d8"
        dark: "#f5f5f4"
        secondary: "#60a5fa"
        tertiary: "#93c5fd"
        highlight: rgba(96, 165, 250, 0.12)
        textHighlight: "#b3aa0288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      condition: not-index
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: mathjax
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: false
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      sortFn: |-
        (a, b) => {
          const rank = { "业务分享": 1, "行业知识": 2, "工具资源": 3, "关于云屿集": 4, "博客": 5, "写作指南": 6, "组件演示": 7 };
          const ra = rank[a.displayName], rb = rank[b.displayName];
          if (ra !== undefined && rb !== undefined) return ra - rb;
          if (ra !== undefined) return -1;
          if (rb !== undefined) return 1;
          if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
          return (a.displayName || "").localeCompare(b.displayName || "", void 0, { numeric: true });
        }
      filterFn: |-
        (node) => {
          const base = (document.body.dataset.basepath || "").replace(/\/+$/, "");
          let path = window.location.pathname;
          if (base && path.startsWith(base)) path = path.slice(base.length);
          const section = path.split("/").filter(Boolean)[0];
          const segs = node.slugSegments || [];
          // 标签页永远不进目录
          if (segs[0] === "tags") return false;
          // 首页/知识库页显示完整目录，其余页面只看当前分类
          if (segs.length === 0) return true;
          if (!section) return true;
          return segs[0] === section;
        }
    layout:
      position: left
      priority: 50
      condition: not-index
  - source: "@quartz-community/graph"
    enabled: true
    options:
      localGraph:
        depth: 2
        scale: 1.15
        fontSize: 13
        linkDistance: 26
        repelForce: 12
        opacityScale: 1
      globalGraph:
        depth: -1
        scale: 1.1
        fontSize: 14
    layout:
      position: right
      priority: 40
      condition: not-index
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: header
      priority: 30
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "./plugins/yyj-crumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "./plugins/yyj-nav"
    enabled: true
    options:
      links:
        - { label: 技术手记, to: /tech/ }
        - { label: 业务与行业, to: /kb }
        - { label: 资源与工具, to: /tools/ }
        - { label: 关于, to: /about/ }
      actions:
        - { label: GitHub, icon: github, href: "https://github.com/YYJ-lin/YYJKnowledgebase" }
        - { label: 微信, icon: wechat, image: /attachments/wechat-qr.webp }
        - { label: QQ, icon: qq, image: /attachments/qq-qr.webp }
    layout:
      position: header
      priority: 10
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: header
      priority: 5
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: header
      priority: 20
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: header
      priority: 25
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "./plugins/yyj-footer"
    enabled: true
    options:
      columns:
        - title: 内容导航
          items:
            - { label: 首页, to: / }
            - { label: 技术手记, to: /tech/ }
            - { label: 知识库, to: /kb }
        - title: 相关资源
          items:
            - { label: 资源与工具, to: /tools/ }
            - { label: GitHub 仓库, href: "https://github.com/YYJ-lin/YYJKnowledgebase" }
        - title: 关于与反馈
          items:
            - { label: 关于本站, to: /about/ }
            - { label: 联系, to: /about/contact }
            - { label: 反馈与联系, href: "https://github.com/YYJ-lin/YYJKnowledgebase/issues" }
      actions:
        - { label: GitHub, icon: github, href: "https://github.com/YYJ-lin/YYJKnowledgebase" }
        - { label: 微信, icon: wechat, image: /attachments/wechat-qr.webp }
        - { label: QQ, icon: qq, image: /attachments/qq-qr.webp }
      legal:
        - { label: 隐私说明, to: /about/privacy }
        - { label: 版权与许可, to: /about/license }
        - { label: RSS, to: /index.xml }
      brand:
        title: 云屿集
        tagline: 业务分享与行业知识
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties: []
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    content: {}
    folder:
      exclude:
        - reader-mode
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
